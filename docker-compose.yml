version: '3.8'

services:
  lab-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-assistant
    ports:
      - "8502:8502"
    volumes:
      - lab_data:/data/lab_data
      - lab_media:/data/media
      - lab_projects:/data/projects
    environment:
      - LAB_ASSISTANT_DATA_DIR=/data/lab_data
      - STREAMLIT_SERVER_PORT=8502
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  lab_data:
  lab_media:
  lab_projects:
