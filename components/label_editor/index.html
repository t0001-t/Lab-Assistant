<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#303030;background:transparent}body.dark{color:#eee}
.toolbar{display:flex;gap:6px;margin:0 0 12px}button{font:inherit;border:1px solid #ccc;background:#fff;color:#303030;padding:7px 14px;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#e6f1ff;border-color:#60a5fa}button:focus-visible,.editor:focus{outline:2px solid #60a5fa;outline-offset:2px}
.editor{background:#fff;border:1px solid #ccc;border-radius:6px;padding:10px;min-height:44px;white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0 12px;font-size:17px}sup,sub{font-size:68%}body.dark .editor,body.dark button{background:#242424;color:#eee;border-color:#555}body.dark button[aria-pressed=true]{background:#284365}#save{background:#e6f1ff;color:#244e7c}#status{font-size:12px;margin-left:10px}label{font-weight:600}
.tablewrap{overflow:auto;max-height:370px;margin-bottom:12px}table{border-collapse:collapse;width:100%;min-width:430px}th,td{text-align:left;border:1px solid #ccc;padding:7px}th{font-size:12px;background:#eee;position:sticky;top:0;z-index:1}td.editor{border-radius:0;margin:0;min-width:130px;font-size:15px}td input{width:68px;padding:5px;border:1px solid #ccc;border-radius:4px;font:inherit;background:transparent;color:inherit}body.dark th{background:#292929}body.dark td,body.dark th{border-color:#555}
</style><link rel="stylesheet" href="ui-theme.css?v=1.0.3"></head><body>
<div class="toolbar" role="toolbar" aria-label="Text formatting"><button type="button" data-command="superscript" aria-label="Hochstellen" title="Hochstellen" aria-pressed="false">x²</button><button type="button" data-command="subscript" aria-label="Tiefstellen" title="Tiefstellen" aria-pressed="false">x₂</button><button type="button" data-command="removeFormat" id="normal">Normal</button></div>
<div class="tablewrap"><table><thead><tr><th id="laneHeading">Spur</th><th id="sampleHeading">Probenbezeichnung</th><th id="bottomHeading">Unteres Label</th><th>X (%)</th></tr></thead><tbody id="rows"></tbody></table></div>
<button id="save" type="button">Übernehmen</button><span id="status" role="status"></span>
<script>
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
let fields=[], active=null,range=null,signature='',english=false;
function height(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
function render(el,runs){el.replaceChildren();for(const [text,style] of runs){const node=document.createElement(style===1?'sup':style===-1?'sub':'span');node.textContent=text;el.append(node)}}
function read(el){const runs=[];function add(t,s){if(!t)return;const last=runs[runs.length-1];if(last&&last[1]===s)last[0]+=t;else runs.push([t,s])}function walk(n,s=0){if(n.nodeType===3){add(n.textContent,s);return}if(n.nodeName==='BR'){add('\n',0);return}const next=n.nodeName==='SUP'?1:n.nodeName==='SUB'?-1:s;if(['DIV','P'].includes(n.nodeName)&&n!==el&&runs.length&&!runs[runs.length-1][0].endsWith('\n'))add('\n',0);for(const child of n.childNodes)walk(child,next)}walk(el);return runs}
function remember(){const sel=getSelection();if(!sel.rangeCount)return;const node=sel.anchorNode;const field=fields.find(f=>f.contains(node));if(field){active=field;range=sel.getRangeAt(0).cloneRange();for(const b of document.querySelectorAll('[data-command]'))if(b.dataset.command!=='removeFormat')b.setAttribute('aria-pressed',String(document.queryCommandState(b.dataset.command)))}}
document.addEventListener('selectionchange',remember);
function bind(el){el.addEventListener('focus',()=>active=el);el.addEventListener('input',()=>{el.dataset.dirty='true';document.getElementById('status').textContent=english?'Unsaved changes':'Noch nicht übernommen';height()});el.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))})}
for(const b of document.querySelectorAll('[data-command]')){b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>{if(!active)return;active.focus();if(range&&active.contains(range.commonAncestorContainer)){const sel=getSelection();sel.removeAllRanges();sel.addRange(range)}const cmd=b.dataset.command;if(cmd==='removeFormat'&&getSelection().isCollapsed){for(const mode of ['superscript','subscript'])if(document.queryCommandState(mode))document.execCommand(mode)}else document.execCommand(cmd);remember();active.dataset.dirty='true';document.getElementById('status').textContent=english?'Unsaved changes':'Noch nicht übernommen';height()})}
document.getElementById('save').onclick=()=>{const rows=Array.from(document.querySelectorAll('tbody tr')).map(tr=>({top:read(tr.children[1]),bottom:read(tr.children[2]),x:Number(tr.querySelector('input').value)}));if(rows.some(r=>!Number.isFinite(r.x)||r.x<0||r.x>100)){document.getElementById('status').textContent=english?'Position must be 0–100':'Position muss zwischen 0 und 100 liegen';return}send('streamlit:setComponentValue',{value:{rows,nonce:Date.now()+Math.random()},dataType:'json'});document.getElementById('status').textContent=english?'Applied':'Übernommen'};
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;const a=e.data.args;english=a.lang==='en';document.body.classList.toggle('dark',a.dark);const next=JSON.stringify(a.rows);if(next!==signature){const existing=[...document.querySelectorAll('tbody tr')];if(existing.length===a.rows.length&&existing.length){a.rows.forEach((row,i)=>{for(const [index,field] of [[1,'top'],[2,'bottom']]){const cell=existing[i].children[index];if(cell.dataset.dirty!=='true')render(cell,row[field])}const input=existing[i].querySelector('input');if(input.dataset.dirty!=='true')input.value=row.x});signature=next}else{const tbody=document.getElementById('rows');tbody.replaceChildren();fields=[];a.rows.forEach((row,i)=>{const tr=document.createElement('tr');const number=document.createElement('td');number.textContent=i+1;tr.append(number);for(const field of ['top','bottom']){const td=document.createElement('td');td.className='editor';td.contentEditable='true';td.setAttribute('role','textbox');td.setAttribute('aria-label',(field==='top'?(english?'Sample name':'Probenbezeichnung'):(english?'Bottom label':'Unteres Label'))+' '+(i+1));render(td,row[field]);bind(td);fields.push(td);tr.append(td)}const pos=document.createElement('td');const input=document.createElement('input');input.type='number';input.min=0;input.max=100;input.step=.1;input.value=row.x;input.addEventListener('input',()=>{input.dataset.dirty='true';document.getElementById('status').textContent=english?'Unsaved changes':'Noch nicht übernommen'});input.setAttribute('aria-label','X (%) '+(i+1));pos.append(input);tr.append(pos);tbody.append(tr)});signature=next;range=null;active=fields[0]}}
document.querySelectorAll('tbody tr').forEach((tr,i)=>{tr.children[1].setAttribute('aria-label',(english?'Sample name':'Probenbezeichnung')+' '+(i+1));tr.children[2].setAttribute('aria-label',(english?'Bottom label':'Unteres Label')+' '+(i+1))});
if(document.querySelector('[data-dirty="true"]'))document.getElementById('status').textContent=english?'Unsaved changes':'Noch nicht übernommen';
document.getElementById('laneHeading').textContent=english?'Lane':'Spur';document.getElementById('sampleHeading').textContent=english?'Sample name':'Probenbezeichnung';document.getElementById('bottomHeading').textContent=english?'Bottom label':'Unteres Label';document.getElementById('save').textContent=english?'Apply':'Übernehmen';for(const b of document.querySelectorAll('[data-command]')){const title=b.dataset.command==='superscript'?(english?'Superscript':'Hochstellen'):b.dataset.command==='subscript'?(english?'Subscript':'Tiefstellen'):'Normal';b.title=title;b.setAttribute('aria-label',title)}height()});
send('streamlit:componentReady',{apiVersion:1});new ResizeObserver(height).observe(document.body);
</script></body></html>
